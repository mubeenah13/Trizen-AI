[alembic]
script_location = backend/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = backend

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root,sentinel,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sentinel]
level = INFO
handlers =
qualname = sentinel

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
